allowBuilds:
  "@firebase/util": true
  protobufjs: true

# Security overrides — force transitive dependencies flagged by Dependabot up to
# their patched release, scoped by the "<fixver" key so only the vulnerable
# instance is touched (an already-patched or higher-major copy is left alone) and
# pinned to the patched version within the SAME major so no consumer is
# cross-major re-resolved. The "parent>child" keys are the second form: when the
# vulnerable package has NO patched release its consumer can take, the fix is to
# move that one PARENT to the release that already depends on a patched child —
# scoped to the named parent so no other consumer of the child is touched.
# Remove an entry once every dependent's own range floats past the patched
# version on its own.
overrides:
  "websocket-driver@<0.7.5": "0.7.5"
  "form-data@<2.5.6": "2.5.6"
  "protobufjs@<7.6.5": "7.6.5"
  "undici@<7.30.1": "7.30.1"
  "@babel/core@<7.29.1": "7.29.7"
  "uuid@<11.1.1": "11.1.1"
  "js-yaml@<3.15.2": "3.15.2"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "brace-expansion@>=3.0.0 <5.0.12": "5.0.12"
  "jake>filelist": "2.0.2"
  "rimraf>glob": "14.0.4"
  "fast-uri@<3.1.9": "3.1.9"
  "fast-xml-parser@<5.12.0": "5.12.0"
  "@fastify/busboy@<3.2.2": "3.2.2"
  "@grpc/grpc-js@>=1.14.0 <1.14.5": "1.14.5"
  "baseline-browser-mapping@<2.11.0": "2.11.28"
  "browserslist@<4.28.7": "4.29.3"
  "nanoid@<3.3.18": "3.3.18"
  "serialize-javascript@<7.1.3": "7.1.3"
  "source-map-js@<1.2.2": "1.2.2"
