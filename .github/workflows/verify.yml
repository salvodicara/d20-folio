name: Verify

# The COMPOSED behavioural verdict, once per merge to main:
# the full Playwright e2e matrix (chromium + mobile + portrait-sw) sharded
# across parallel runners, the offline proof, plus the composed unit suite — all
# against the same
# composition that deploys (the private content pack checked out and landed at
# ./content-pack, the seam deploy.yml uses). Public-repo Actions minutes are
# free, so every main SHA carries a full verdict AMBIENTLY; `deploy.yml` then
# PROMOTES a verified SHA instead of re-running a ~48-minute unsharded matrix.
#
# ci.yml is the SRD-only twin (the public tree's own composition, push + PR);
# this workflow is the composed one. Both must stay green (GOLDEN_RULES Vincoli #3).
#
# workflow_dispatch exists to re-verify a SHA (for example with a newer pack).
#
# On main a running Verify always finishes: with several lanes merging,
# cancelling the in-flight run meant main never got a full verdict. GitHub keeps
# at most one pending run per group and replaces older pending ones, so each
# finished run is a full verdict on a recent SHA. Any other ref still cancels.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pack_sha:
        description: "Pack commit to compose instead of the pack's main (a pack PR's head, for scripts/lockstep-merge.sh)."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The pack commit this run composes, resolved ONCE, so every job tests the same
  # composition even if a pack merge lands mid-run (or while the run is pending).
  # deploy.yml reads the `verified-pack` artifact to deploy exactly that commit.
  pack:
    name: pin the pack commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - id: pin
        env:
          GH_TOKEN: ${{ secrets.CONTENT_PACK_TOKEN }}
          REQUESTED: ${{ inputs.pack_sha }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            sha="$(gh api "repos/salvodicara/d20-folio-content/commits/$REQUESTED" --jq .sha)"
          else
            sha="$(gh api repos/salvodicara/d20-folio-content/commits/main --jq .sha)"
          fi
          echo "Composing pack $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha" > verified-pack.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-pack
          path: verified-pack.txt
          retention-days: 90

  # The composed checks run as three jobs side by side, never one long one: on
  # 2026-11-06 the single "unit + budget" job grew past its 25-minute cap (lint 8 min,
  # unit 14 min on ~34k tests) and three main runs in a row were cut off before the
  # budget step. Each job now has about twice its measured time as its cap, and the
  # unit suite is split into shards so it grows across runners, not into the cap.
  #
  # No Firebase env here ON PURPOSE: the unit suite must pass with
  # VITE_FIREBASE_API_KEY unset (docs/CONTRIBUTING.md — unit tests never reach
  # Firebase), and an ambient env would silently mask a test that starts to.
  static:
    name: typecheck + lint (composed)
    needs: pack
    # Pinned: Playwright cannot install Chromium on ubuntu-latest = 26.04 (2026-11).
    runs-on: ubuntu-24.04
    # Measured 6–9 min (2026-11-06).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/compose-pack
        with:
          token: ${{ secrets.CONTENT_PACK_TOKEN }}
          ref: ${{ needs.pack.outputs.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # ci.yml typechecks and lints the public tree; only here do the pack's
      # sources join `tsc -b` and `eslint 'content-pack/**'`.
      - name: Typecheck (composed)
        run: pnpm typecheck
      - name: Lint (composed)
        run: pnpm lint --max-warnings 0

  unit:
    name: unit (composed, shard ${{ matrix.shard }}/3)
    needs: pack
    runs-on: ubuntu-24.04
    # The whole suite took 14 min on one runner (2026-11-06): about 5 a shard.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/compose-pack
        with:
          token: ${{ secrets.CONTENT_PACK_TOKEN }}
          ref: ${{ needs.pack.outputs.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (composed — pack suites included)
        run: pnpm test --shard=${{ matrix.shard }}/3

  budget:
    name: conformance + budget (composed)
    needs: pack
    runs-on: ubuntu-24.04
    # Measured 2 min (2026-11-06).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/compose-pack
        with:
          token: ${{ secrets.CONTENT_PACK_TOKEN }}
          ref: ${{ needs.pack.outputs.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # The rules conformance count (docs/architecture/2026-11-edge-cases.md):
      # one test per corpus case; a "works" case that fails turns this red.
      - name: Rules conformance count
        run: |
          pnpm exec vitest run --project fast tests/unit/conformance content-pack/tests/unit/conformance \
            --reporter=json --outputFile=conformance.json > /dev/null || true
          node --import ./scripts/alias-loader.mjs scripts/conformance-count.ts conformance.json
      # The composed bundle budget. ci.yml measures the SRD-only build; only this
      # job and deploy.yml measure what actually ships (app + pack). Without it,
      # three release reviews in a row met an over-budget precache on deploy day,
      # long after the PR that grew it (2026-10-13 and 2026-10-16). The same build
      # command deploy.yml runs before its own budget gate.
      - name: Build (composed)
        run: pnpm build
      - name: Bundle budget (composed)
        run: pnpm test:budget

  e2e:
    name: e2e (shard ${{ matrix.shard }}/8)
    needs: pack
    # Pinned: Playwright cannot install Chromium on ubuntu-latest = 26.04 (2026-11).
    runs-on: ubuntu-24.04
    # Green shards already take up to 29 minutes (2026-11-05), so a slow runner
    # hit the old 30-minute cap and cancelled whole runs with no failing test.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: "d20-folio.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "d20-folio"
      VITE_FIREBASE_STORAGE_BUCKET: "d20-folio.firebasestorage.app"
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      # The flags the deploy builds with (deploy.yml): the e2e that gates a deploy runs
      # the build players get. Guarded by deploy-flags-verified.guard.test.ts.
      VITE_PEER_SPENDS_LEDGER: "true"
      VITE_COMBAT_EFFECTS_V26: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/compose-pack
        with:
          token: ${{ secrets.CONTENT_PACK_TOKEN }}
          ref: ${{ needs.pack.outputs.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      # One worker per runner (measured — playwright.config.ts); parallelism
      # comes from the shards. The blob reporter feeds the merged report below.
      - name: E2E shard
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/8 --reporter=blob
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  # A single merged HTML report, published only when a shard failed — the one
  # artifact to open when Verify goes red. Short retention: the repo is public,
  # and failure screenshots can show composed (pack) content — same exposure
  # class as the deployed app itself (owner-accepted, soft-launch charter).
  # The offline proof (playwright.offline.config.ts): a production-shaped build with
  # the service worker, one online visit in Italian, then the sheet, spells and
  # bestiary offline. Its own build and port, so it is not part of the shards.
  offline:
    name: e2e (offline)
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/compose-pack
        with:
          token: ${{ secrets.CONTENT_PACK_TOKEN }}
          ref: ${{ needs.pack.outputs.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Offline e2e
        run: pnpm test:e2e:offline
      - name: Upload the failure trace
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-offline-trace
          path: test-results
          retention-days: 3

  report:
    name: merged e2e report
    if: ${{ failure() }}
    needs: [e2e]
    # Pinned: Playwright cannot install Chromium on ubuntu-latest = 26.04 (2026-11).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge into one HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload merged report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: playwright-report
          retention-days: 3
