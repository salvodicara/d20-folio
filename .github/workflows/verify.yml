name: Verify

# The COMPOSED behavioural verdict, once per merge to main (golden rule 14):
# the full Playwright e2e matrix (chromium + mobile + portrait-sw on `main`) sharded
# across parallel runners, plus the composed unit suite — both against the same
# composition that deploys (the private content pack checked out and landed at
# ./content-pack, the seam deploy.yml uses). Public-repo Actions minutes are
# free, so every main SHA carries a full verdict AMBIENTLY; `deploy.yml` then
# PROMOTES a verified SHA instead of re-running a ~48-minute unsharded matrix.
#
# `v2` runs no browser suite in CI until its new surfaces land (stage 6); the
# accessibility sweep runs by hand there (`pnpm test:e2e`), see docs/CONTRIBUTING.md.
#
# ci.yml is the SRD-only twin (the public tree's own composition, push + PR);
# this workflow is the composed one. Both must stay green (golden rule 28).
#
# workflow_dispatch exists to re-verify a SHA whose push run was superseded
# (concurrency cancels an in-flight run when a newer merge lands).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No Firebase env here ON PURPOSE: the unit suite must pass with
  # VITE_FIREBASE_API_KEY unset (docs/CONTRIBUTING.md — unit tests never reach
  # Firebase), and an ambient env would silently mask a test that starts to.
  unit:
    name: unit (composed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Checkout the private content pack
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: salvodicara/d20-folio-content
          token: ${{ secrets.CONTENT_PACK_TOKEN }}
          path: .pack
      # existsSync(content-pack/index.ts) is what flips the `@pack` alias to
      # pack mode (scripts/content-pack-mode.ts).
      - name: Compose the content pack
        run: |
          mv .pack/content-pack ./content-pack
          rm -rf .pack
          test -f content-pack/index.ts
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.50.0"
      - run: pnpm install --frozen-lockfile
      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions
      - name: Unit tests (composed — pack suites included)
        run: pnpm test

  e2e:
    name: e2e (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: "d20-folio.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "d20-folio"
      VITE_FIREBASE_STORAGE_BUCKET: "d20-folio.firebasestorage.app"
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Checkout the private content pack
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: salvodicara/d20-folio-content
          token: ${{ secrets.CONTENT_PACK_TOKEN }}
          path: .pack
      - name: Compose the content pack
        run: |
          mv .pack/content-pack ./content-pack
          rm -rf .pack
          test -f content-pack/index.ts
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      # One worker per runner (measured — playwright.config.ts); parallelism
      # comes from the shards. The blob reporter feeds the merged report below.
      - name: E2E shard
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/8 --reporter=blob
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  # A single merged HTML report, published only when a shard failed — the one
  # artifact to open when Verify goes red. Short retention: the repo is public,
  # and failure screenshots can show composed (pack) content — same exposure
  # class as the deployed app itself (owner-accepted, soft-launch charter).
  report:
    name: merged e2e report
    if: ${{ failure() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge into one HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload merged report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: playwright-report
          retention-days: 3
