name: CI

# The SRD-only ambient gate: every push to main and every pull request runs
# typecheck + lint, the unit suite, the production build, and independent Functions lint/test/build
# jobs — as PARALLEL jobs so the wall clock is the slowest lane (the unit suite), not the sum.
#
# SRD-only by construction: the public tree has no `content-pack/`, and the
# `@pack` alias resolves by directory PRESENCE (scripts/content-pack-mode.ts;
# the tsconfig `paths` fallback mirrors it) — so the plain commands below ARE
# the SRD-only composition. No mode flags, no secrets required: the unit suite
# and the production build both pass with no Firebase env.
#
# The COMPOSED twin is verify.yml (pack unit suite + the full sharded e2e
# matrix, per merge to main); deploy.yml promotes a SHA both have verified.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions
      - name: Lint Functions
        run: npm run lint
        working-directory: functions
      - name: Test Functions
        run: npm test
        working-directory: functions
      - name: Build Functions
        run: npm run build
        working-directory: functions

  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Single source of truth for the Node version: the asdf pin
          # (.tool-versions, Node 24.16.0) the app develops and ships on.
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint --max-warnings 0

  unit:
    name: unit (SRD-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test

  build:
    name: build + budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # `vite build` only — the static job runs `tsc -b`; dist/ is byte-identical
      # without it. The build also runs the i18n leak-lock, so an untranslated
      # string fails here.
      - name: Build
        run: pnpm exec vite build
      # The eager-bundle/precache ceilings guard (golden rule 24) reads dist/,
      # so it runs after the build, in this same job.
      - name: Bundle budget
        run: pnpm test:budget
