name: CI

# The SRD-only ambient gate: every push to main and every pull request runs
# typecheck + lint, the unit suite, the production build, the new UI's design rules on
# Linux, the security rules against the Firebase emulators, and independent Functions lint/test/build jobs — as PARALLEL jobs so the wall clock is the slowest lane (the unit suite), not the sum.
#
# SRD-only by construction: the public tree has no `content-pack/`, and the
# `@pack` alias resolves by directory PRESENCE (scripts/content-pack-mode.ts;
# the tsconfig `paths` fallback mirrors it) — so the plain commands below ARE
# the SRD-only composition. No mode flags, no secrets required: the unit suite
# and the production build both pass with no Firebase env.
#
# The COMPOSED twin is verify.yml (pack unit suite + the full sharded e2e
# matrix, per merge to main); deploy.yml promotes a SHA both have verified. The one
# composed job here is `build + budget (composed)` on pull requests (it needs the
# pack token).

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds each entry on top of main plus the entries ahead of it; the
  # required checks below must run there too, or the queue waits forever. Verify (the
  # e2e and the rehearsal) stays out of the queue: it runs on main after the merge, and
  # the deploy requires it green.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: functions
    # Pinned: Playwright cannot install Chromium on ubuntu-latest = 26.04 (2026-11).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions
      - name: Lint Functions
        run: npm run lint
        working-directory: functions
      - name: Test Functions
        run: npm test
        working-directory: functions
      - name: Build Functions
        run: npm run build
        working-directory: functions

  static:
    name: typecheck + lint
    # Pinned: Playwright cannot install Chromium on ubuntu-latest = 26.04 (2026-11).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Single source of truth for the Node version: the asdf pin
          # (.tool-versions, Node 24.16.0) the app develops and ships on.
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint --max-warnings 0
      # The pre-commit hook formats, but a commit made around it reached main unformatted
      # (2026-11-12). The files a change touches are checked here, where it cannot be skipped.
      - name: Formatting (the files this change touches)
        if: github.event_name != 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff -z --name-only --diff-filter=d "$BASE_SHA" HEAD -- \
            '*.ts' '*.tsx' '*.css' '*.json' '*.md' '*.yml' \
            | xargs -0 -r pnpm exec prettier --check --ignore-unknown

  unit:
    name: unit (SRD-only, shard ${{ matrix.shard }}/2)
    # Pinned: Playwright cannot install Chromium on ubuntu-latest = 26.04 (2026-11).
    runs-on: ubuntu-24.04
    # One runner took up to 11 min of its 15 (2026-11-06); two shards keep the margin
    # as the suite grows (verify.yml splits its composed twin the same way).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test --shard=${{ matrix.shard }}/2
      # The rules conformance count (docs/architecture/2026-11-edge-cases.md):
      # one test per corpus case; a "works" case that fails turns this red. Once.
      - name: Rules conformance count
        if: matrix.shard == 1
        run: |
          pnpm exec vitest run --project fast tests/unit/conformance content-pack/tests/unit/conformance \
            --reporter=json --outputFile=conformance.json > /dev/null || true
          node --import ./scripts/alias-loader.mjs scripts/conformance-count.ts conformance.json

  build:
    name: build + budget
    # Pinned: Playwright cannot install Chromium on ubuntu-latest = 26.04 (2026-11).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # `vite build` only — the static job runs `tsc -b`; dist/ is byte-identical
      # without it. The build also runs the i18n leak-lock, so an untranslated
      # string fails here.
      - name: Build
        run: pnpm exec vite build
      # The public SRD catalogue (API step 3) must keep exporting cleanly: it runs
      # SRD-only and refuses any non-SRD entry, so a data drift fails here.
      - name: SRD catalogue
        run: pnpm srd:catalogue
      # The engine as a library (API step 2): builds SRD-only, type-checks a
      # consumer against the emitted declarations, and runs the built bundle on
      # the fixture exports in plain Node.
      - name: Folio Core package
        run: pnpm core:build
      # The core imports no private pack (the full text comparison runs in the
      # composed job below, where the pack is present).
      - name: Folio Core SRD boundary
        run: pnpm core:boundary
      # The eager-bundle/precache ceilings guard reads dist/,
      # so it runs after the build, in this same job.
      - name: Bundle budget
        run: pnpm test:budget

  # The bundle budget on the COMPOSED build (app + the pack's main), on pull requests.
  # The SRD-only build above has headroom the shipped bundle does not: the pack's
  # English text rides the eager closure, so an app PR that grows it passed here and
  # only failed Verify after the merge (#837/#839, 2026-11-05). This measures what
  # verify.yml and deploy.yml measure, before the merge. Same-repo PRs only (a fork
  # has no pack token).
  build-composed:
    name: build + budget (composed)
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/compose-pack
        with:
          token: ${{ secrets.CONTENT_PACK_TOKEN }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build (composed)
        run: pnpm exec vite build
      - name: Bundle budget (composed)
        run: pnpm test:budget
      # The published core must carry none of the pack: built SRD-only, then read
      # against the emitted pack's text and art (skill srd-boundary). Logs name files only.
      - name: Folio Core SRD boundary (against the pack)
        run: pnpm core:build && pnpm core:boundary --require-pack

  # The partition guards against the pack's own private list (owner, 2026-11-12): a
  # live player's character name, uid or slug anywhere in the public tree turns the
  # pull request red before the merge, not Verify after it. Same-repo PRs only, by
  # the plain `pull_request` trigger (never `pull_request_target`): a fork has no
  # pack token, so this job is skipped there, not failed. The guard prints file:line
  # only, never the matched value, since this log is public.
  partition-composed:
    name: partition guards (composed)
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/compose-pack
        with:
          token: ${{ secrets.CONTENT_PACK_TOKEN }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Partition guards (against the pack's private list)
        run: pnpm exec vitest run --project fast tests/unit/content-pack-partition.guard.test.ts

  # The design rules of the new UI (tests/e2e/ui-*.spec.ts) on every pull request,
  # on Linux: text width and wrapping depend on the OS's font rendering, so a Mac-only
  # pass must not reach main (a 320px header wrapped only here, 2026-11-02). Plus the
  # fight smoke (a sheet inside an encounter renders, old UI and new): #682 crashed
  # every sheet in a fight and no completed run saw it. The full e2e matrix still runs
  # per merge in verify.yml.
  design-rules:
    name: design rules (Linux)
    runs-on: ubuntu-24.04
    # The official Playwright image (Ubuntu 24.04 «noble», its browser and fonts
    # inside), at the lockfile's Playwright version: no apt at run time, so an apt
    # mirror outage cannot fail the job (2026-11-11, azure.archive.ubuntu.com
    # unresolvable). playwright-image.guard.test.ts keeps the tag on the lockfile's.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 15
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: "d20-folio.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "d20-folio"
      VITE_FIREBASE_STORAGE_BUCKET: "d20-folio.firebasestorage.app"
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      # The flags the deploy builds with (deploy.yml): the e2e that gates a deploy runs
      # the build players get. Guarded by deploy-flags-verified.guard.test.ts.
      VITE_PEER_SPENDS_LEDGER: "true"
      VITE_COMBAT_EFFECTS_V26: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Design rules
        run: pnpm exec playwright test tests/e2e/ui- tests/e2e/fight-smoke --project=chromium --project=new-ui

  # The e2e smoke on every pull request (2026-11-13): main's Verify was red for hours
  # because PR CI ran no e2e, and a cast that broke the sheet merged unseen. Three paths
  # players use every session, desktop Chromium only, in a few minutes: the classic cast
  # → tray → undo, a save spell on three targets with one saved, and a condition spell on
  # a goblin in the fight. PR CI has no content pack, so no spec here may need its team
  # sheets (monster-actions does). Verify still runs the whole matrix after the merge.
  e2e-smoke:
    name: e2e smoke
    runs-on: ubuntu-24.04
    # The design rules' container: the lockfile's Playwright, its browser and fonts.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 12
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: "d20-folio.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "d20-folio"
      VITE_FIREBASE_STORAGE_BUCKET: "d20-folio.firebasestorage.app"
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_PEER_SPENDS_LEDGER: "true"
      VITE_COMBAT_EFFECTS_V26: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: E2E smoke
        run: >-
          pnpm exec playwright test tests/e2e/simple-casting.spec.ts
          tests/e2e/damage-tray.spec.ts
          --project=chromium
          --grep "simple cast persists and undoes: en dark desktop|\((b|c)\) [^(]+\(it, dark, desktop\)"

  # firestore.rules and storage.rules against the real emulators (`pnpm test:rules`,
  # vitest.rules.config.ts): the access matrix, the migration kit's apply path and the
  # session-log adapter. A rule change cannot land unchecked. The emulators are JVM
  # processes, so this lane needs Java; their downloaded JARs are cached.
  rules:
    name: rules (emulator)
    # Pinned: Playwright cannot install Chromium on ubuntu-latest = 26.04 (2026-11).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          # The JDK pinned in .tool-versions (Temurin 25).
          distribution: "temurin"
          java-version: "25"
      - run: pnpm install --frozen-lockfile
      # The same pin the deploy uses (deploy.yml).
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.28.1
      - name: Cache emulator JARs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.28.1
      - name: Rules tests
        run: pnpm test:rules
