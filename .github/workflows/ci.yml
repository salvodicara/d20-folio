name: CI

# The SRD-only ambient gate: every push to main and every pull request runs
# typecheck + lint, the unit suite, the production build, the new UI's design rules on
# Linux, the security rules against the Firebase emulators, and independent Functions lint/test/build jobs — as PARALLEL jobs so the wall clock is the slowest lane (the unit suite), not the sum.
#
# SRD-only by construction: the public tree has no `content-pack/`, and the
# `@pack` alias resolves by directory PRESENCE (scripts/content-pack-mode.ts;
# the tsconfig `paths` fallback mirrors it) — so the plain commands below ARE
# the SRD-only composition. No mode flags, no secrets required: the unit suite
# and the production build both pass with no Firebase env.
#
# The COMPOSED twin is verify.yml (pack unit suite + the full sharded e2e
# matrix, per merge to main); deploy.yml promotes a SHA both have verified. The one
# composed job here is `build + budget (composed)` on pull requests (it needs the
# pack token).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: functions
    # Pinned: Playwright cannot install Chromium on ubuntu-latest = 26.04 (2026-11).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions
      - name: Lint Functions
        run: npm run lint
        working-directory: functions
      - name: Test Functions
        run: npm test
        working-directory: functions
      - name: Build Functions
        run: npm run build
        working-directory: functions

  static:
    name: typecheck + lint
    # Pinned: Playwright cannot install Chromium on ubuntu-latest = 26.04 (2026-11).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Single source of truth for the Node version: the asdf pin
          # (.tool-versions, Node 24.16.0) the app develops and ships on.
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint --max-warnings 0

  unit:
    name: unit (SRD-only, shard ${{ matrix.shard }}/2)
    # Pinned: Playwright cannot install Chromium on ubuntu-latest = 26.04 (2026-11).
    runs-on: ubuntu-24.04
    # One runner took up to 11 min of its 15 (2026-11-06); two shards keep the margin
    # as the suite grows (verify.yml splits its composed twin the same way).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test --shard=${{ matrix.shard }}/2
      # The rules conformance count (docs/architecture/2026-11-edge-cases.md):
      # one test per corpus case; a "works" case that fails turns this red. Once.
      - name: Rules conformance count
        if: matrix.shard == 1
        run: |
          pnpm exec vitest run --project fast tests/unit/conformance content-pack/tests/unit/conformance \
            --reporter=json --outputFile=conformance.json > /dev/null || true
          node --import ./scripts/alias-loader.mjs scripts/conformance-count.ts conformance.json

  build:
    name: build + budget
    # Pinned: Playwright cannot install Chromium on ubuntu-latest = 26.04 (2026-11).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # `vite build` only — the static job runs `tsc -b`; dist/ is byte-identical
      # without it. The build also runs the i18n leak-lock, so an untranslated
      # string fails here.
      - name: Build
        run: pnpm exec vite build
      # The public SRD catalogue (API step 3) must keep exporting cleanly: it runs
      # SRD-only and refuses any non-SRD entry, so a data drift fails here.
      - name: SRD catalogue
        run: pnpm srd:catalogue
      # The engine as a library (API step 2): builds SRD-only, type-checks a
      # consumer against the emitted declarations, and runs the built bundle on
      # the fixture exports in plain Node.
      - name: Folio Core package
        run: pnpm core:build
      # The eager-bundle/precache ceilings guard reads dist/,
      # so it runs after the build, in this same job.
      - name: Bundle budget
        run: pnpm test:budget

  # The bundle budget on the COMPOSED build (app + the pack's main), on pull requests.
  # The SRD-only build above has headroom the shipped bundle does not: the pack's
  # English text rides the eager closure, so an app PR that grows it passed here and
  # only failed Verify after the merge (#837/#839, 2026-11-05). This measures what
  # verify.yml and deploy.yml measure, before the merge. Same-repo PRs only (a fork
  # has no pack token).
  build-composed:
    name: build + budget (composed)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/compose-pack
        with:
          token: ${{ secrets.CONTENT_PACK_TOKEN }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build (composed)
        run: pnpm exec vite build
      - name: Bundle budget (composed)
        run: pnpm test:budget

  # The design rules of the new UI (tests/e2e/ui-*.spec.ts) on every pull request,
  # on Linux: text width and wrapping depend on the OS's font rendering, so a Mac-only
  # pass must not reach main (a 320px header wrapped only here, 2026-11-02). Plus the
  # fight smoke (a sheet inside an encounter renders, old UI and new): #682 crashed
  # every sheet in a fight and no completed run saw it. The full e2e matrix still runs
  # per merge in verify.yml.
  design-rules:
    name: design rules (Linux)
    # Pinned: Playwright cannot install Chromium on ubuntu-latest = 26.04 (2026-11).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: "d20-folio.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "d20-folio"
      VITE_FIREBASE_STORAGE_BUCKET: "d20-folio.firebasestorage.app"
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Design rules
        run: pnpm exec playwright test tests/e2e/ui- tests/e2e/fight-smoke --project=chromium --project=new-ui

  # firestore.rules and storage.rules against the real emulators (`pnpm test:rules`,
  # vitest.rules.config.ts): the access matrix, the migration kit's apply path and the
  # session-log adapter. A rule change cannot land unchecked. The emulators are JVM
  # processes, so this lane needs Java; their downloaded JARs are cached.
  rules:
    name: rules (emulator)
    # Pinned: Playwright cannot install Chromium on ubuntu-latest = 26.04 (2026-11).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          # The JDK pinned in .tool-versions (Temurin 25).
          distribution: "temurin"
          java-version: "25"
      - run: pnpm install --frozen-lockfile
      # The same pin the deploy uses (deploy.yml).
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.28.1
      - name: Cache emulator JARs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.28.1
      - name: Rules tests
        run: pnpm test:rules
