name: Deploy
run-name: Release 0.24.1 saved-character compatibility — ${{ inputs.operation }}

# Operational topic branch only: inspect the released code against production.
# This branch never deploys and must not replace the main deployment workflow.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect compatibility or re-apply the documented identity migration
        required: true
        default: check
        type: choice
        options:
          - check
          - reapply_identity
      pack_ref:
        description: Content pack commit used by the verified release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  compatibility:
    name: Restore and verify released-client compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate pinned content pack commit
        env:
          PACK_REF: ${{ inputs.pack_ref }}
        run: '[[ "$PACK_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: 1083e7986043f4a99cb052c779176cc5be5093cc
      - name: Checkout the private content pack
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: salvodicara/d20-folio-content
          ref: ${{ inputs.pack_ref }}
          token: ${{ secrets.CONTENT_PACK_TOKEN }}
          path: .pack
      - name: Compose the content pack
        run: |
          mv .pack/content-pack ./content-pack
          rm -rf .pack
          test -f content-pack/index.ts
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Inspect identity and parent compatibility without writing
        if: inputs.operation == 'check'
        run: |
          set +e
          node --import ./scripts/alias-loader.mjs scripts/migrate-custom-identity.ts --check
          identity_status=$?
          node --import ./scripts/alias-loader.mjs scripts/migrate-character-parents.ts --check
          parents_status=$?
          echo "Compatibility status: identity=$identity_status parents=$parents_status"
          if [ "$identity_status" -ne 0 ] || [ "$parents_status" -ne 0 ]; then
            exit 1
          fi
      - name: Set up gcloud for the private backup
        if: inputs.operation == 'reapply_identity'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Back up Firestore before the identity re-apply
        if: inputs.operation == 'reapply_identity'
        id: backup
        run: |
          set -euo pipefail
          umask 077
          backup_root="gs://d20-folio-backups/identity-v0.24.1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          backup_local="$RUNNER_TEMP/identity-v0.24.1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$backup_local"
          gcloud firestore export "$backup_root/firestore" --project=d20-folio
          gcloud storage ls "$backup_root/firestore/" >/dev/null
          echo "BACKUP_ROOT=$backup_root" >> "$GITHUB_ENV"
          echo "BACKUP_LOCAL=$backup_local" >> "$GITHUB_ENV"
          echo "Complete Firestore backup verified: $backup_root/firestore"
      - name: Re-apply only the existing deterministic identity migration
        if: inputs.operation == 'reapply_identity'
        run: |
          set -euo pipefail
          node --import ./scripts/alias-loader.mjs scripts/migrate-custom-identity.ts --dry-run
          node --import ./scripts/alias-loader.mjs scripts/migrate-custom-identity.ts \
            --apply --backup "$BACKUP_LOCAL/identity"
      - name: Preserve document before-images in the private backup bucket
        if: always() && inputs.operation == 'reapply_identity' && steps.backup.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -d "$BACKUP_LOCAL/identity" ]; then
            gcloud storage cp --recursive "$BACKUP_LOCAL/identity" "$BACKUP_ROOT/documents/"
            gcloud storage ls "$BACKUP_ROOT/documents/identity/manifest.json" >/dev/null
            echo "Document before-images preserved privately"
          fi
      - name: Require both compatibility checks green after re-apply
        if: success() && inputs.operation == 'reapply_identity'
        run: |
          node --import ./scripts/alias-loader.mjs scripts/migrate-custom-identity.ts --check
          node --import ./scripts/alias-loader.mjs scripts/migrate-character-parents.ts --check
