name: Deploy

# Owner-fired, dispatch-ONLY — never on push (golden rule 22: deploys are always
# explicitly owner-triggered):  gh workflow run deploy.yml --ref main
#
# PROMOTE, don't re-verify: every merge to main already runs the SRD-only gate
# (ci.yml) and the composed unit suite + full sharded e2e matrix (verify.yml).
# This workflow WAITS for both verdicts on the target SHA (they may still be in
# flight when the owner fires it), requires them green, then composes the
# private content pack, builds, checks the bundle budget, and deploys — a few
# minutes instead of re-running a ~48-minute unsharded matrix. The promotion
# owns the whole Firebase release: a blocking Firestore export, Functions on
# Node 24, then Hosting + Firestore/Storage rules, all from this exact SHA. It never
# promotes a composition Verify never saw: the pack is pinned to the commit that
# was its head when the green Verify run started (a later PACK-ONLY merge does not
# ride along), and an explicit `pack_sha` input must equal that commit. To ship a
# newer pack, or after a superseded run, re-verify the SHA first:
#   gh workflow run verify.yml --ref main
#
# `just deploy` is only a convenience dispatcher for this workflow; there is no
# second local production path. Secrets: CONTENT_PACK_TOKEN (read
# access to salvodicara/d20-folio-content), FIREBASE_SERVICE_ACCOUNT, and the
# VITE_FIREBASE_* build secrets below.

on:
  workflow_dispatch:
    inputs:
      pack_sha:
        description: "Content-pack commit to compose (full SHA). Empty = the pack commit Verify composed."
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    name: require green CI + Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for this SHA's CI + Verify verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # ONE 40 × 60 s wait budget shared by both workflows (fits the job
          # timeout). A freshly-pushed SHA's runs can take a minute to register,
          # so "no run yet" only fails after a 3-attempt grace window.
          declare -A ok=()
          for attempt in $(seq 1 40); do
            waiting=""
            for wf in ci.yml verify.yml; do
              [ "${ok[$wf]:-}" = 1 ] && continue
              runs="$(gh run list --repo "$REPO" --workflow "$wf" --commit "$SHA" \
                        --json status,conclusion)"
              if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
                ok[$wf]=1
                echo "✓ $wf green"
                continue
              fi
              if [ "$(jq 'length' <<<"$runs")" -eq 0 ]; then
                if [ "$attempt" -ge 3 ]; then
                  echo "✗ no $wf run exists for $SHA — dispatch one first:"
                  echo "    gh workflow run $wf --ref main"
                  exit 1
                fi
              elif ! jq -e 'any(.[]; .status != "completed")' <<<"$runs" >/dev/null; then
                echo "✗ every completed $wf run for $SHA is non-green (failed or"
                echo "  superseded/cancelled). Fix the failure, or re-verify:"
                echo "    gh workflow run $wf --ref main"
                exit 1
              fi
              waiting="$waiting $wf"
            done
            [ -z "$waiting" ] && break
            echo "… waiting for:$waiting (attempt $attempt/40) — sleeping 60 s"
            sleep 60
          done
          for wf in ci.yml verify.yml; do
            [ "${ok[$wf]:-}" = 1 ] || {
              echo "✗ $wf did not turn green within the wait budget."; exit 1; }
          done

      # Verify composed whatever pack commit was the head when its run STARTED;
      # that commit is the only composition ever tested with this SHA. Resolve it
      # (the newest pack commit at or before the green run's createdAt) and pin the
      # deploy to it, so a pack-only merge after Verify can neither sneak in nor
      # change what a re-run deploys. An explicit `pack_sha` must match it.
      - name: Resolve the pack commit Verify composed
        id: pack
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_TOKEN: ${{ secrets.CONTENT_PACK_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REQUESTED: ${{ inputs.pack_sha }}
        run: |
          set -euo pipefail
          verified_at="$(gh run list --repo "$REPO" --workflow verify.yml --commit "$SHA" \
            --json conclusion,createdAt \
            --jq '[.[] | select(.conclusion == "success")][0].createdAt')"
          composed="$(GH_TOKEN="$PACK_TOKEN" gh api \
            "repos/salvodicara/d20-folio-content/commits?sha=main&until=${verified_at}&per_page=1" \
            --jq '.[0].sha')"
          echo "Verify green at: $verified_at · pack composed then: $composed"
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$composed" ]; then
            echo "✗ pack_sha $REQUESTED is not the pack Verify composed ($composed)."
            echo "  Re-verify with that pack as head, or deploy the composed one."
            exit 1
          fi
          echo "sha=$composed" >> "$GITHUB_OUTPUT"
    outputs:
      pack_sha: ${{ steps.pack.outputs.sha }}

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: "d20-folio.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "d20-folio"
      VITE_FIREBASE_STORAGE_BUCKET: "d20-folio.firebasestorage.app"
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout the private content pack
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: salvodicara/d20-folio-content
          ref: ${{ needs.verify.outputs.pack_sha }}
          token: ${{ secrets.CONTENT_PACK_TOKEN }}
          path: .pack

      # Land the pack at ./content-pack — existsSync(content-pack/index.ts) is
      # what flips the `@pack` alias to pack mode (scripts/content-pack-mode.ts).
      - name: Compose the content pack
        run: |
          mv .pack/content-pack ./content-pack
          rm -rf .pack
          test -f content-pack/index.ts

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      # Build the deploy artifact (the i18n leak-lock runs inside the build);
      # the bundle-budget guard reads the dist/ that actually ships.
      - name: Require production client configuration
        run: |
          set -euo pipefail
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_APPCHECK_SITE_KEY; do
            test -n "${!name:-}" || { echo "::error::Missing required repository secret: $name"; exit 1; }
          done
      - name: Build
        run: pnpm build
      - name: Bundle budget
        run: pnpm test:budget

      # Authenticate only after building, so the short-lived credentials file can
      # never enter dist/. The existing secret is a service-account JSON key;
      # google-github-actions/auth exports standard ADC and removes the file in its
      # post step. WIF is the eventual keyless replacement, but the current
      # long-running Functions deploy needs the already-proven credential path.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      # P1 was migrated before its client shipped. Old clients may have since
      # reintroduced legacy entries, so prove the current corpus immediately
      # before promotion. Both checks are read-only and fail on any pending work.
      - name: Verify saved-character compatibility
        run: |
          node --import ./scripts/alias-loader.mjs scripts/migrate-custom-identity.ts --check
          node --import ./scripts/alias-loader.mjs scripts/migrate-character-parents.ts --check

      - name: Require live Blaze billing
        run: |
          set -euo pipefail
          account="$(gcloud billing projects describe d20-folio --format='value(billingAccountName)')"
          enabled="$(gcloud billing projects describe d20-folio --format='value(billingEnabled)' | tr '[:upper:]' '[:lower:]')"
          account="${account#billingAccounts/}"
          open="$(gcloud billing accounts describe "$account" --format='value(open)' | tr '[:upper:]' '[:lower:]')"
          test "$enabled" = true && test "$open" = true || {
            echo "::error::Blaze billing is not attached to an open account; refusing every deploy target."
            exit 1
          }

      - name: Back up Firestore before promotion
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          backup="gs://d20-folio-backups/pre-v${version}-${GITHUB_SHA::12}-$(date -u +%Y%m%dT%H%M%SZ)"
          gcloud firestore export "$backup" --project=d20-folio
          gcloud storage ls "$backup/" >/dev/null
          echo "✓ Firestore backup: $backup"

      # Pin the CLI instead of inheriting a Docker action's stale Node 20 runtime:
      # firebase.json deliberately requires Node 24 for the Functions predeploy.
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.28.1

      # Functions go first. They are backwards-compatible with the currently live
      # client, so a later Hosting failure leaves the old UI on a compatible backend.
      # --force lets the deploy delete a Function removed from source (a
      # non-interactive run otherwise refuses); the health check below pins the
      # exact set that must remain.
      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project d20-folio --non-interactive --force

      - name: Require every Function healthy on Node 24
        run: |
          set -euo pipefail
          expected='deleteUser ogImage ogShell onBudgetAlert onBugReportCreated onUserCreated'
          for attempt in $(seq 1 12); do
            active="$(firebase functions:list --project d20-folio --json \
              | jq -r '.result[] | select(.region == "europe-west1" and .runtime == "nodejs24" and .state == "ACTIVE") | .id' \
              | sort | xargs)"
            if [ "$active" = "$expected" ]; then
              echo "✓ all Functions ACTIVE on Node 24"
              break
            fi
            [ "$attempt" -lt 12 ] || {
              echo "::error::Functions health mismatch. Expected: $expected · Active: $active"
              exit 1
            }
            sleep 10
          done

      - name: Deploy Hosting and security rules
        run: firebase deploy --only hosting,firestore:rules,storage --project d20-folio --non-interactive

      - name: Require SAFE-01 armed after promotion
        run: scripts/safe-01.sh status
