name: Deploy
run-name: Release 0.24.1 saved-character compatibility check

# Operational topic branch only: inspect the released code against production.
# This branch never deploys and must not replace the main deployment workflow.
on:
  workflow_dispatch:
    inputs:
      pack_ref:
        description: Content pack commit used by the verified release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    name: Inspect both saved-character checks (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate pinned content pack commit
        env:
          PACK_REF: ${{ inputs.pack_ref }}
        run: '[[ "$PACK_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: 1083e7986043f4a99cb052c779176cc5be5093cc
      - name: Checkout the private content pack
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: salvodicara/d20-folio-content
          ref: ${{ inputs.pack_ref }}
          token: ${{ secrets.CONTENT_PACK_TOKEN }}
          path: .pack
      - name: Compose the content pack
        run: |
          mv .pack/content-pack ./content-pack
          rm -rf .pack
          test -f content-pack/index.ts
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Inspect identity and parent compatibility without writing
        run: |
          set +e
          node --import ./scripts/alias-loader.mjs scripts/migrate-custom-identity.ts --check
          identity_status=$?
          node --import ./scripts/alias-loader.mjs scripts/migrate-character-parents.ts --check
          parents_status=$?
          echo "Compatibility status: identity=$identity_status parents=$parents_status"
          if [ "$identity_status" -ne 0 ] || [ "$parents_status" -ne 0 ]; then
            exit 1
          fi
